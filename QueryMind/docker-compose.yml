version: '3.8'

services:
  querymind:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: false
    env_file: .env

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: querymind
      POSTGRES_USER: querymind
      POSTGRES_PASSWORD: querymind_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querymind"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: python -m querymind api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  postgres_data:
