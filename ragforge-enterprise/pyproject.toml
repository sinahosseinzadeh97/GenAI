[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragforge-enterprise"
version = "0.1.0"
description = "Enterprise-grade RAG document ingestion and chunking pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RAGForge Team" }]

dependencies = [
    "pypdf>=4.0.0",
    "pdfplumber>=0.10.0",
    "sentence-transformers>=2.7.0",
    "tiktoken>=0.7.0",
    "langdetect>=1.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.0",
    # Phase 2 – Vector store & Embedding
    "qdrant-client>=1.9.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.0",
    "tenacity>=8.3.0",
    "umap-learn>=0.5.6",
    # Phase 3 – LexReview
    "spacy>=3.7",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    # Phase 4 – Italia connector layer
    "lxml>=5.0.0",             # XML parsing for Normattiva NIR/URN responses
    "beautifulsoup4>=4.12.0",  # HTML scraping for Gazzetta, TAR, Corte Cost.
    "html2text>=2024.2.26",    # Clean HTML → Markdown plain text
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "types-seaborn",
    "httpx>=0.27.0",
]
finetune = [
    "peft>=0.11.0",
    "trl>=0.9.0",
    "bitsandbytes>=0.43.0",
    "transformers>=4.41.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
]
# Phase 2 — Italian NLP pipeline
# Install with: pip install -e ".[italia]"
# Then bootstrap the spaCy model: python -m spacy download it_core_news_lg
italia = [
    # Multilingual sentence-transformers (E5-large-instruct + mpnet fallback)
    "sentence-transformers>=2.7.0",
    # Cross-encoder reranker (mMARCO multilingual)
    # Model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    # (downloaded automatically via sentence-transformers)
    # spaCy Italian model is installed separately via:
    #   python -m spacy download it_core_news_lg
    "spacy>=3.7",
    # Italian legal text cleaning extras
    "ftfy>=6.1.0",          # Text encoding repair for garbled Italian PDFs
    # Phase 5 — Italian market features
    "python-multipart>=0.0.9",  # Required for FastAPI multipart/form-data (PDF upload)
    # Phase 6 — Integration connectors
    "zeep>=4.2.0",              # SOAP/WSDL client for Notartel gateway
    "pyyaml>=6.0.0",            # YAML parsing for docker-compose.italia.yml tests
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
log_cli = true
log_cli_level = "INFO"
asyncio_mode = "auto"
